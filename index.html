<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farmer ID Dashboard · Tehsil Assar &amp; Kastigarh</title>
<meta name="description" content="Live progress of Farmer ID creation in Tehsil Assar and Tehsil Kastigarh, District Doda.">
<meta name="theme-color" content="#1F5A3E">
<meta property="og:type" content="website">
<meta property="og:title" content="Farmer ID Dashboard">
<meta property="og:description" content="Tehsil Assar &amp; Kastigarh, District Doda · live progress of Farmer ID creation">
<meta property="og:image" content="https://tehsildarkastigarhdoda.github.io/farmerid/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://tehsildarkastigarhdoda.github.io/farmerid/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#F3F5F2;color:#16201B}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid #E0E6E2}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top img{width:44px;height:44px;flex:none}
.top .nm{flex:1;min-width:0}.top .nm b{display:block;font-size:19px;color:#1F5A3E;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .nm small{display:block;font-size:12.5px;color:#55635B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login{flex:none;background:#1F5A3E;color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;text-decoration:none;font-size:15px}
main{max-width:1180px;margin:0 auto;padding:16px}
.upd{font-size:12.5px;color:#55635B;margin:-4px 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upd button{border:1.5px solid #CFDCD3;background:#fff;border-radius:10px;padding:4px 10px;font-weight:700;color:#1F5A3E;cursor:pointer}
footer{max-width:1180px;margin:10px auto 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px);font-size:12.5px;color:#6A776F;text-align:center;line-height:1.6}
footer .cr{margin-top:6px;color:#55635B;font-weight:600}
.err{background:#FDECEA;color:#B42318;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:12px}
@media (max-width:420px){.top .nm b{font-size:16.5px}.login{padding:9px 12px}}
</style>
</head>
<body class="pub">
<header class="top"><div class="in"><img src="logo.svg" alt=""><div class="nm"><b>Farmer ID Dashboard</b><small>Tehsil Assar &amp; Kastigarh · District Doda</small></div><a class="login" href="app.html">Log in</a></div></header>
<main><div class="upd" id="upd"></div><div id="msg"></div><div id="dash"></div></main>
<footer>Figures are compiled from the Agristack portal files uploaded by the Tehsil offices and are indicative. The portal remains the official record.
<div class="cr">Designed and developed by Pushpak Saroop, JKAS, Tehsildar Kastigarh.</div></footer>
<script src="dash.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwub02oM7BIpM6fDPr_LWvj5iSV5tNfr_EDCypcyu4TaTI96deXjPBXBg0IEWLgu39y/exec';
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('practice')) { location.replace('app.html?practice'); return; }
  // someone already logged in on this phone goes straight to the app (it opens on the same dashboard)
  try {
    const has = indexedDB.databases ? (await indexedDB.databases()).some(d => d.name === 'farmerid') : true;
    if (has) {
      const s = await new Promise(res => { const r = indexedDB.open('farmerid', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { try { const g = r.result.transaction('kv').objectStore('kv').get('session'); g.onsuccess = () => { res(g.result); r.result.close(); }; g.onerror = () => res(null); } catch (e) { res(null); } }; r.onerror = () => res(null); });
      if (s && s.token && !q.has('public')) { location.replace('app.html'); return; }
    }
  } catch (e) {}
  const root = document.getElementById('dash'), upd = document.getElementById('upd'), msg = document.getElementById('msg');
  let last = null; try { last = JSON.parse(localStorage.getItem('d7:last') || 'null'); } catch (e) {}
  const draw = d => { DASH.render(root, d, {}); upd.innerHTML = `<span>Updated ${DASH.t12(d.now)} · updates by itself</span><button id="rf">Refresh</button>`; document.getElementById('rf').onclick = load; };
  if (last) draw(last); else DASH.render(root, null);
  async function load() {
    try {
      const r = await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action: 'dash' }) }); const d = await r.json();
      if (!d.ok) { const er = new Error(d.error || 'Could not load.'); er.server = 1; throw er; } msg.innerHTML = ''; draw(d); try { localStorage.setItem('d7:last', JSON.stringify(d)); } catch (e) {}
    } catch (e) { const why = e.server ? (/Unknown action/.test(e.message) ? 'The server is on an older version: the office needs to deploy the new Code.gs (Deploy > Manage deployments > New version).' : 'The server replied: ' + e.message) : navigator.onLine ? 'Could not reach the server.' : 'No internet.';
      msg.innerHTML = `<div class="err">${why.replace(/</g, '&lt;')} ${last ? 'Showing the last figures.' : 'Try again in a minute.'}</div>`; }
  }
  load(); setInterval(() => { if (document.visibilityState === 'visible') load(); }, 120000);
  let uv; setInterval(async () => { if (document.visibilityState !== 'visible') return; try { const r = await (await fetch(API_URL, { method: 'POST', redirect: 'follow', body: '{"action":"ver"}' })).json(); if (uv !== undefined && r.uv !== uv) load(); uv = r.uv; } catch (e) {} }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
