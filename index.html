<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwub02oM7BIpM6fDPr_LWvj5iSV5tNfr_EDCypcyu4TaTI96deXjPBXBg0IEWLgu39y/exec';
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('practice')) { location.replace('app.html?practice'); return; }
  // someone already logged in on this phone goes straight to the app (it opens on the same dashboard)
  try {
    const has = indexedDB.databases ? (await indexedDB.databases()).some(d => d.name === 'farmerid') : true;
    if (has) {
      const s = await new Promise(res => { const r = indexedDB.open('farmerid', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { try { const g = r.result.transaction('kv').objectStore('kv').get('session'); g.onsuccess = () => { res(g.result); r.result.close(); }; g.onerror = () => res(null); } catch (e) { res(null); } }; r.onerror = () => res(null); });
    }
  } catch (e) {}
  const root = document.getElementById('dash'), upd = document.getElementById('upd'), msg = document.getElementById('msg');
  let last = null; try { last = JSON.parse(localStorage.getItem('d7:last') || 'null'); } catch (e) {}
  const draw = d => { last = d; const isClose = String(d.now || '').slice(11, 13) >= '20';
    (T8.pub10 || T8.today)(document.getElementById('rc'), d, { openCamps: true, bottom: '<div class="t8-share"><button class="t8-btn" id="sp8">📷 Share picture</button><button class="t8-btn o" id="sl8">🔗 Share this page</button></div><div style="margin-top:10px"><button class="t8-btn o" id="ss8" style="width:100%">Tall picture for WhatsApp Status</button></div>' });
    const page = location.origin + location.pathname.replace(/index\.html$/, '');
    const shp = shape => { const c = T8.picture(d, shape, isClose); c.toBlob(async b => { const f = new File([b], 'Farmer ID ' + (isClose ? 'day close' : 'update') + '.jpg', { type: 'image/jpeg' }), text = T8.message(d, isClose, page);
      if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], text }); } catch (e) {} } else { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); } }, 'image/jpeg', 0.9); };

    document.getElementById('sl8').onclick = async () => { if (navigator.share) { try { await navigator.share({ title: 'Farmer ID · Assar & Kastigarh', text: 'Farmer ID live status', url: page }); } catch (e) {} } else { try { await navigator.clipboard.writeText(page); alert('Link copied'); } catch (e) {} } }; upd.innerHTML = `<span>Updated ${DASH.t12(d.now)} · updates by itself</span><button id="rf">Refresh</button>`; document.getElementById('rf').onclick = load; };
  if (last) { try { draw(last); } catch (e) { last = null; try { localStorage.removeItem('d7:last'); } catch (e2) {} root.innerHTML = ''; } } else root.innerHTML = '';
  let busy85 = false, retry85 = null;
  async function load() {
    if (busy85) return; busy85 = true; clearTimeout(retry85);
    if (typeof T8 === 'undefined') { msg.innerHTML = '<div class="err">The page did not load fully (weak internet). <button onclick="location.reload()">Reload</button></div>'; busy85 = false; return; }
    const ac = new AbortController(), t0 = Date.now(), to = setTimeout(() => ac.abort(), 30000);
    const tk = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); if (s >= 6) msg.innerHTML = `<div class="err" style="background:#FFF7EA;color:#8A5A00">Waiting for the server · ${s} s… ${last ? 'Showing the last figures meanwhile.' : 'Please keep the page open.'}</div>`; }, 1000);
    try {
      const r = await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action: 'dash' }), signal: ac.signal }); const d = await r.json();
      if (!d.ok) { const er = new Error(d.error || 'Could not load.'); er.server = 1; throw er; } msg.innerHTML = ''; draw(d); try { localStorage.setItem('d7:last', JSON.stringify(d)); } catch (e) {}
    } catch (e) { if (e.name === 'AbortError') e = { message: 'timeout', slow: 1 }; retry85 = setTimeout(load, last ? 60000 : 10000);
      const why = e.slow ? 'The server did not answer in 30 seconds. Trying again by itself…' : e.server ? (/Unknown action/.test(e.message) ? 'The server is on an older version: the office needs to deploy the new Code.gs (Deploy > Manage deployments > New version).' : 'The server replied: ' + e.message) : navigator.onLine ? 'Could not reach the server.' : 'No internet.';
      msg.innerHTML = `<div class="err">${why.replace(/</g, '&lt;')} ${last ? 'Showing the last figures.' : (e.slow ? '' : 'Trying again by itself.')} <button onclick="location.reload()">Reload</button></div>`; }
    finally { clearTimeout(to); clearInterval(tk); busy85 = false; }
  }
  load(); setInterval(() => { if (document.visibilityState === 'visible') load(); }, 120000);
  let uv; setInterval(async () => { if (document.visibilityState !== 'visible') return; try { const r = await (await fetch(API_URL, { method: 'POST', redirect: 'follow', body: '{"action":"ver"}' })).json(); if (uv !== undefined && r.uv !== uv) load(); uv = r.uv; } catch (e) {} }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
