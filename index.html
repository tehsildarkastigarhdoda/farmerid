<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farmer ID">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Farmer ID Dashboard – Assar &amp; Kastigarh</title>
<style>
:root{
  --pine:#1F4D3A; --pine2:#2C6B52; --pine3:#163828; --leaf:#E4EFE8; --saffron:#F2A900; --ink:#17201C; --mute:#56625C; --line:#D5DDD8; --bg:#F4F6F3; --card:#FFFFFF;
  --made:#16794A; --ta:#B42318; --tb:#B45309; --tc:#1F57C3; --ns:#98A29D; --unl:#D9DEDB;
  --warnbg:#FFF5E6; --errbg:#FDECEC; --okbg:#E8F4EC; --z:1;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
#view,.sheet-in{zoom:var(--z)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s ease,background-color .12s ease}
button:active:not(:disabled),a.btn:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
header#bar{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;min-height:56px}
#back{background:none;border:0;color:#fff;font-size:30px;line-height:1;padding:2px 10px 6px 2px}
#title{flex:1;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:0;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap}
.pill.wait{background:#F2B705;color:#2B2200}.pill.off{background:#56625C}.pill.err{background:#E5484D}.pill.busy{background:#2C6B52}.pill.ok-flash{background:var(--made)}
#hlp{background:#fff;border:0;color:var(--pine);width:34px;height:34px;border-radius:50%;font-weight:800;font-size:18px;flex:none}
#netbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,transparent,var(--saffron),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:nb 1s linear infinite;display:none}
#netbar.on{display:block}
@keyframes nb{from{background-position:-40% 0}to{background-position:140% 0}}
#upd{position:sticky;top:56px;z-index:19;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--saffron);color:#2B2200;padding:10px 14px;font-weight:700}
#upd[hidden]{display:none}#upd button{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}
main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.pad{padding:16px;max-width:760px;margin:0 auto}
h1.big{font-size:28px;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:21px;margin:22px 0 8px}
h3{font-size:18px;margin:18px 0 8px}
.hint{color:var(--mute);margin:4px 0 14px}
.guide{display:flex;gap:10px;align-items:flex-start;background:#FFF8E1;border:1.5px solid #F3DE9C;border-radius:12px;padding:10px 12px;margin:6px 0 14px;font-size:15.5px;color:#3D3205}
.guide::before{content:"i";flex:none;width:22px;height:22px;border-radius:50%;background:var(--saffron);color:#2B2200;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;margin-top:1px}
.err{background:var(--errbg);color:#8A1C14;padding:12px 14px;border-radius:10px}
.input,select.input,textarea.input{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
textarea.input{min-height:90px}
.field{margin:0 0 14px}.field label{display:block;font-weight:650;margin-bottom:6px}.field small{display:block;color:var(--mute);margin-top:4px;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 16px;border-radius:12px;border:1.5px solid #C9DACF;background:var(--leaf);color:var(--pine3);font-weight:700;margin:8px 0;text-align:center;text-decoration:none}
.btn-primary{background:var(--pine);border-color:var(--pine);color:#fff}
.btn-made{background:var(--made);border-color:var(--made);color:#fff;font-size:19px;min-height:62px}
.btn-danger{background:#fff;border-color:#E9B3AE;color:var(--ta)}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--pine2);font-weight:650;padding:10px 0;text-decoration:underline}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;gap:10px;align-items:center;color:var(--mute)}
/* login */
.names{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.names button{min-height:56px;text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.names button small{display:block;color:var(--mute);font-size:14px}
/* home */
.hero{color:#fff;padding:16px 18px 20px;border-radius:0 0 24px 24px;
  background:repeating-linear-gradient(168deg,rgba(255,255,255,.045) 0 9px,transparent 9px 21px),linear-gradient(180deg,var(--pine) 0%,var(--pine3) 100%)}
.hero-in{max-width:760px;margin:0 auto}
.hero .hi{font-size:22px;font-weight:750;margin:0}.hero .role{margin:2px 0 14px;color:#C7DCCF;font-size:15px}
.hnum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}.hnum b{font-size:46px;line-height:1;letter-spacing:-.02em}.hnum span{color:#D6E6DC}
.hero .strip{height:14px;background:rgba(255,255,255,.2)}
.hrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:#D6E6DC}.hrow b{color:#fff;font-size:19px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:100px;padding:14px;border-radius:16px;border:0;text-align:left;color:#fff;font-weight:750;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.14)}
.tile small{font-weight:500;font-size:13px;opacity:.92;line-height:1.3}
.tile.c1{background:#2C6B52}.tile.c2{background:#1F57C3}.tile.c3{background:#7C3AED}.tile.c4{background:#B45309}.tile.c5{background:#0E7490}.tile.c6{background:#475569}.tile.c7{background:#16794A}.tile.c8{background:#9F1239}
.tile.wide{grid-column:1 / -1;min-height:74px;flex-direction:row;align-items:center;gap:14px;font-size:18px}
.tile.wide span{display:flex;flex-direction:column}
.sec{font-size:15px;font-weight:800;color:var(--mute);margin:22px 2px 6px}
.vcard{position:relative;display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--pine2);border-radius:14px;padding:14px 14px 12px;margin:0 0 12px}
.vcard.prac{border-style:dashed;border-left-style:solid;border-left-color:var(--saffron);background:#FFFDF5}
.vtop{display:flex;flex-direction:column;padding-right:78px}
.vtop b{font-size:20px}.vtop span{color:var(--mute);font-size:14px}
.vpct{position:absolute;right:14px;top:12px;text-align:right;font-size:26px;font-weight:800;color:var(--pine);line-height:1}.vpct small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.vhead{font-size:15px;margin:8px 0 8px;color:var(--mute)}
.vline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin-top:8px}
.vline b{color:var(--ink)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--warnbg);color:#7A4A00}
.tehsil{font-size:15px;font-weight:800;color:var(--mute);margin:18px 0 8px}
.board{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;margin:10px 0}
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #E6EBE8}.brow:last-child{border:0}
.brow .md{width:28px;text-align:center;font-size:20px}.brow .nm2{flex:1;min-width:0}.brow .nm2 small{display:block;color:var(--mute);font-size:13px}
.brow .sc{text-align:right;font-weight:800}.brow .sc small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.brow.me{background:#F2F8F4;margin:0 -12px;padding:9px 12px}
.bar{height:8px;border-radius:4px;background:#E6EBE8;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--made)}
/* strip */
.strip{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--unl)}
.strip i{display:block;height:100%}
.s-made{background:var(--made)}.s-C{background:var(--tc)}.s-B{background:var(--tb)}.s-A{background:var(--ta)}.s-ns{background:var(--ns)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:8px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* banners */
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warnbg);border:1.5px solid #F1D3A2;border-radius:12px;padding:10px 12px;margin:10px 0}
.banner p{margin:0;font-size:15px}.banner button{flex:none;border:0;background:var(--pine);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700}
.banner.info{background:#EAF1FB;border-color:#C9D9F3}.banner.ok{background:var(--okbg);border-color:#BFE0CB}.banner.red{background:var(--errbg);border-color:#F1C0BB}
/* filters */
.search{margin:12px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipf{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;font-weight:650;white-space:nowrap}
.chipf b{color:var(--mute);font-weight:800;margin-left:2px}
.chipf.on{background:var(--ink);border-color:var(--ink);color:#fff}.chipf.on b{color:#C9D3CE}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 4px}
.seg button{border:0;background:#fff;min-height:46px;font-weight:700}.seg button.on{background:var(--pine);color:#fff}
/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:62px}
.row .rt{flex:1;min-width:0}.row b{display:block;font-size:17px}
.row small{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.d-made{background:var(--made)}.d-A{background:var(--ta)}.d-B{background:var(--tb)}.d-C{background:var(--tc)}.d-ns{background:#fff;border:2px solid var(--ns)}
.st{flex:none;max-width:42%;font-size:13px;font-weight:700;padding:4px 8px;border-radius:6px;text-align:right}
.st-made{color:var(--made);background:#E3F3EA}.st-A{color:var(--ta);background:#FBE9E7}.st-B{color:#8A4100;background:#FDF0E1}
.st-C{color:var(--tc);background:#E7EEFB}.st-ns{color:var(--mute);background:#EEF1EF}
.fam{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px}
.fam b{font-size:17px}.fam small{display:block;color:var(--mute);font-size:14px;margin:2px 0 8px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.hidden{display:none}
.sheet-in{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.snav{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);padding:8px 0}
.snav button{border:1.5px solid var(--line);background:#fff;border-radius:12px;min-height:46px;padding:8px 16px;font-weight:700}
.snav span{color:var(--mute);font-size:15px}
.nm{font-size:26px;margin:8px 0 2px;letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 12px;font-size:16px}
.facts dt{color:var(--mute)}.facts dd{margin:0;font-weight:650;word-break:break-word}
.now{margin:4px 0 12px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:68px;padding:10px 12px;border:1.5px solid var(--line);border-left:9px solid var(--t,#999);
  border-radius:12px;background:#fff;text-align:left;font-size:16px;line-height:1.25}
.rbtn b{font-weight:750}.rbtn small{color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.morer .rbtn small{-webkit-line-clamp:4}
.rbtn.tA{--t:var(--ta)}.rbtn.tB{--t:var(--tb)}.rbtn.tC{--t:var(--tc)}
.rbtn.cur{background:#FFFBE8;border-color:#E3C454}
details.more,details.morer{margin:14px 0;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:0 12px}
details summary{min-height:54px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details[open]{padding-bottom:12px}
.morer .rbtn{width:100%;margin:6px 0}
.grp{font-weight:800;font-size:15px;margin:14px 0 4px}.grp.gA{color:var(--ta)}.grp.gB{color:var(--tb)}.grp.gC{color:var(--tc)}
.toggle{display:flex;gap:8px}.toggle button{flex:1;min-height:48px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:700}
.toggle button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.mem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #E6EBE8}
.mem:last-child{border-bottom:0}
.mem input[type=checkbox]{width:26px;height:26px;flex:none}
.mem .rt{flex:1;min-width:0}.mem small{display:block;color:var(--mute);font-size:14px}
.dcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.dconf{font-weight:800;margin:0 0 6px}.dconf.HIGH{color:var(--ta)}.dconf.MEDIUM{color:var(--tb)}.dconf.CONFIRMED{color:var(--made)}
.dm{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #E6EBE8}
.dm input{width:24px;height:24px;margin-top:3px;flex:none}
.dm .rt{flex:1}.dm small{display:block;color:var(--mute);font-size:14px}
.dm .link{padding:4px 0;font-size:15px}
.muted{color:var(--mute)}
.prob{background:var(--errbg);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px}
.prev{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.prev h3{margin:0 0 6px}.prev ul{margin:6px 0;padding-left:18px}.prev .w{color:#8A4100}
.hist{font-size:14px;border-top:1px solid #E6EBE8;padding:8px 0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-16px);opacity:0;z-index:80;display:flex;gap:10px;align-items:center;
  background:var(--made);color:#fff;padding:13px 18px;border-radius:14px;font-weight:700;font-size:16px;width:max-content;max-width:92vw;pointer-events:none;transition:.18s;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.err{background:var(--ta)}#toast.info{background:var(--ink)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast i{font-style:normal;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex:none}
/* tour & guided steps */
.tcard{background:#fff;border-radius:18px;border:1.5px solid var(--line);padding:22px 18px;margin:12px 0;text-align:center}
.tcard .big{width:76px;height:76px;border-radius:22px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--pine)}
.tcard h2{margin:6px 0 8px}.tcard p{font-size:17px;margin:8px 0}
.tdots{display:flex;justify-content:center;gap:8px;margin:12px 0}.tdots i{width:9px;height:9px;border-radius:50%;background:#C9D3CE}.tdots i.on{background:var(--pine);width:22px;border-radius:5px}
.mock{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;text-align:left}
.step{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.step .num{flex:none;width:34px;height:34px;border-radius:50%;background:#E6EBE8;color:var(--mute);display:flex;align-items:center;justify-content:center;font-weight:800}
.step.done{background:#F2F8F4;border-color:#BFE0CB}.step.done .num{background:var(--made);color:#fff}
.step.cur{border:2.5px solid var(--pine);box-shadow:0 4px 14px rgba(31,77,58,.15)}.step.cur .num{background:var(--pine);color:#fff}
.step .sb{flex:1}.step h3{margin:2px 0 4px}.step p{margin:0 0 6px;color:var(--mute);font-size:15px}
/* office tables, charts */
.rwrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:10px 0}
table.rt{border-collapse:collapse;font-size:13px;min-width:100%}
table.rt th,table.rt td{border:1px solid #DDE3E0;padding:5px 7px;text-align:center;white-space:nowrap}
table.rt th{background:var(--pine);color:#fff;font-weight:650}
table.rt td:first-child,table.rt th:first-child{text-align:left;position:sticky;left:0;background:#fff;white-space:normal;min-width:190px;max-width:280px}
table.rt th:first-child{background:var(--pine)}
table.rt tr.b td{font-weight:700}table.rt tr.s td:first-child{padding-left:18px;color:var(--mute)}
table.rt td.sub{background:#F3F7F4}table.rt td.tot{background:#EAF2ED;font-weight:700}
table.rt tr.ck td{color:var(--made);font-weight:700}table.rt tr.ck td.bad{color:var(--ta)}
.paper{background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:20px 18px;font-family:"Times New Roman",Times,serif;font-size:15px;line-height:1.4;max-height:520px;overflow:auto;white-space:pre-wrap}
.chk{display:flex;gap:10px;align-items:center;min-height:46px}.chk input{width:24px;height:24px}
table.grid{width:100%;border-collapse:collapse;background:#fff}
table.grid td,table.grid th{border-bottom:1px solid #E3E8E5;padding:6px;vertical-align:middle;text-align:left}
table.grid th{font-size:13px;color:var(--mute)}
table.grid td.sn{font-weight:800;width:44px}
table.grid small{display:block;color:var(--mute);font-size:13px}
table.grid input{width:100%;min-height:42px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:16px}
table.grid input.gc{width:54px;text-align:center;font-weight:800;font-size:20px}
table.grid tr.saved{background:#F0F8F3}table.grid tr.bad{background:var(--errbg)}
table.grid td.gs{font-size:13px;font-weight:650;max-width:150px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.keys span{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:28px;line-height:1.1}.kpi span{color:var(--mute);font-size:14px}
.kpi.red b{color:var(--ta)}.kpi.green b{color:var(--made)}
.chart{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.chart svg{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(120px,40%) 1fr 44px;gap:8px;align-items:center;font-size:14px;padding:4px 0}

let _db;
function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => { const r = indexedDB.open('farmerid', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { _db = r.result; res(_db); }; r.onerror = () => rej(r.error); });
}
async function kget(k) { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function kput(k, v) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function kdel(k) { const d = await idb(); return new Promise(res => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => res(); }); }
async function kkeys() { const d = await idb(); return new Promise(res => { const q = d.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); }

class NetError extends Error {}
const WRITE_API = ['saveBuckets', 'confirmSuggestions', 'dupConfirm', 'dupBreak', 'saveCamp', 'uploadApply', 'saveUser', 'resetPin', 'saveVillage', 'saveAssignments',
  'saveReason', 'saveSettings', 'saveTehsil', 'deleteUser', 'saveVillageAll', 'resetPractice', 'regApply', 'regConfirm', 'regNone', 'regUnlink', 'changePin', 'transferVillages', 'markSheetDone',
  'pinApprove', 'noticeSave', 'noticeRead', 'spotSave', 'setZoom', 'practiceKeep', 'campaign', 'pmkSave', 'pmkApply', 'portalDown', 'savePH', 'startFresh'];
async function api(action, payload, timeout) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), timeout || 45000);
  const body = Object.assign({ action, token: S.session ? S.session.token : '' }, payload || {});
  // Every save carries a one-time code, so a double tap or a retry is never done twice on the server.
  if (WRITE_API.includes(action) && !body.req_id) body.req_id = uid() + uid();
  if (S.session) body.hb = { pending: S.queue.length, v: APP_V, last_sync: S.lastSync || '', oldest: S.queue.length ? (S.queue[0].at || String(S.queue[0].ts || '').replace(' ', 'T') + '+05:30') : '' };
  body.client_now = new Date().toISOString();
  let res; netOn(1);
  try {
    const r = await fetch(API_URL, { method: 'POST', redirect: 'follow', signal: ctrl.signal, body: JSON.stringify(body) });
    res = await r.json();
  } catch (e) { throw new NetError('No internet connection. Try again when you have signal.'); }
  finally { clearTimeout(t); netOn(-1); }
  if (!res.ok) {
    if (res.error === 'SESSION_EXPIRED') { await expireSession(); throw new Error('Please log in again.'); }
    throw new Error(res.error || 'Something went wrong.');
  }
  return res;
}

async function expireSession() {
  S.session = null; await kdel('session');
  NAV.stack = [{ name: 'login', args: {} }]; closeAllSheets(); render();
  info('Please log in again. Your saved work is kept on this phone.');
}

/* ======================= OFFLINE QUEUE & SYNC ======================= */
async function persistQueue() { await kput(qKey(), S.queue); await kput(pKey(), S.problems); }
async function enqueue(action, payload, local) {
  S.queue.push({ id: uid(), action, payload, local: local || [], ts: nowIST(), at: new Date().toISOString() });
  await persistQueue(); updatePill(); scheduleSync(1500);
}
function scheduleSync(ms) { clearTimeout(scheduleSync._t); scheduleSync._t = setTimeout(sync, ms || 0); }

async function sync() {
  if (S.syncing || !S.session || !S.queue.length || !navigator.onLine) { updatePill(); return; }
  S.syncing = true; updatePill();
  let conflicts = false; const startN = S.queue.length;
  try {
    while (S.queue.length) {
      const first = S.queue[0];
      if (first.action === 'saveBuckets') {
        let n = 0; const batch = [];
        while (n < S.queue.length && S.queue[n].action === 'saveBuckets' && batch.length < 150) { batch.push(...S.queue[n].payload.updates); n++; }
        const r = await api('saveBuckets', { updates: batch, req_id: 'b-' + S.queue[0].id + '-' + n }, 90000);
        r.results.forEach(x => {
          if (!x.ok) { S.problems.push({ bucket_id: x.bucket_id, error: x.error, ts: nowIST() }); if (x.conflict) conflicts = true; }
          else markUploaded(x);
        });
        S.queue.splice(0, n);
      } else {
        try { await api(first.action, Object.assign({ req_id: first.id }, first.payload), 60000); }
        catch (e) { if (e instanceof NetError) throw e; S.problems.push({ error: e.message, ts: nowIST() }); conflicts = true; }
        S.queue.shift();
      }
      await persistQueue();
    }
    S.lastSync = nowIST(); await kput('lastSync', S.lastSync);
    S.flash = Date.now(); setTimeout(updatePill, 3200);
    if (startN && !SHEET && (!S.reachAt || Date.now() - S.reachAt > 15000)) { S.reachAt = Date.now(); toast(startN === 1 ? L('reached') : L('n_reached', startN)); }
    refreshStats(true, true);
    if (conflicts) await refreshLoadedVillages();
  } catch (e) { /* offline again: keep queue */ }
  finally { S.syncing = false; updatePill(); }
}

function markUploaded(x) {
  Object.keys(S.buckets).forEach(vid => {
    const b = (S.buckets[vid] || []).find(y => y.bucket_id === x.bucket_id);
    if (b) { b._pending = false; b.updated_at = x.updated_at; if (x.flag !== undefined) b.flag = x.flag; }
  });
}

/* Apply a change locally exactly as the server will. */
function applyLocal(b, f) {
  const wasClaimed = b.status === 'CLAIMED';
  const later = f.later; f = Object.assign({}, f); delete f.later;
  Object.assign(b, f);
  if (later !== undefined) b.flag = later ? 'LATER' : (b.flag === 'LATER' ? '' : b.flag);
  if (b.status !== 'NOT_SURVEYED' && b.flag === 'LATER') b.flag = '';
  if (f.gender !== undefined) b.gender_source = 'USER';
  if (b.status === 'CLAIMED') b.reason_code = '';
  if (b.status === 'REASON' && f.residence === undefined && f.reason_code && IMPLIES[f.reason_code]) b.residence = IMPLIES[f.reason_code];
  if (b.status === 'CLAIMED' && !wasClaimed) { b.claimed_source = 'FIELD'; b.claimed_date = f.made_on || todayIST(); b.claimed_by = S.forUser || me().user_id; }
  if (b.status !== 'CLAIMED' && wasClaimed) { b.claimed_source = ''; b.claimed_date = ''; b.claimed_by = ''; }
  if (b.status !== 'NOT_SURVEYED' && !b.surveyed_date) { b.surveyed_date = todayIST(); b.surveyed_by = S.forUser || me().user_id; }
  if (b.status === 'NOT_SURVEYED') { b.surveyed_date = ''; b.surveyed_by = ''; b.reason_code = ''; }
  if ((b.flag === 'NEW' || b.flag === 'REOPENED') && b.status !== 'NOT_SURVEYED') b.flag = '';
  if (b.flag === 'NO_FIELD_ENTRY' && b.mobile) b.flag = 'CONFIRMED';
  b.updated_by = me().user_id; b.updated_by_name = me().name; b.updated_at = nowIST(); b._pending = true;
}

function overlayPending(vid, arr) {
  const idx = {}; arr.forEach(b => idx[b.bucket_id] = b);
  S.queue.forEach(q => (q.local || []).forEach(l => { if (idx[l.bucket_id]) { const keep = idx[l.bucket_id]; Object.assign(keep, l.fields); keep._pending = true; } }));
}

async function loadVillage(vid, force) {
  if (!force && S.buckets[vid]) return S.buckets[vid];
  if (!force) { const c = await kget('b:' + vid); if (c) { S.buckets[vid] = c; S.reg[vid] = (await kget('r:' + vid)) || []; S.pmk[vid] = (await kget('k:' + vid)) || []; S.coll[vid] = !!(await kget('c:' + vid)); return c; } }
  try {
    const r = await api('getBuckets', { village_id: vid }, 90000);
    overlayPending(vid, r.buckets);
    S.buckets[vid] = r.buckets; S.fetchedAt[vid] = Date.now(); delete S.top[vid];
    S.reg[vid] = r.reg || []; await kput('r:' + vid, S.reg[vid]);
    S.pmk[vid] = r.pmk || []; S.coll[vid] = !!r.collect; await kput('k:' + vid, S.pmk[vid]); await kput('c:' + vid, S.coll[vid]);
    await kput('b:' + vid, r.buckets);
    return r.buckets;
  } catch (e) {
    if (S.buckets[vid]) return S.buckets[vid];
    const c = await kget('b:' + vid); if (c) { S.buckets[vid] = c; S.reg[vid] = (await kget('r:' + vid)) || []; S.pmk[vid] = (await kget('k:' + vid)) || []; S.coll[vid] = !!(await kget('c:' + vid)); return c; }
    if (e instanceof NetError) throw new Error('This village is not saved on this phone yet. Connect to the internet once to download it.');
    throw e;
  }
}
async function refreshLoadedVillages() { for (const vid of Object.keys(S.buckets)) { try { await loadVillage(vid, true); } catch (e) {} } S.dirty = true; if (!SHEET) render(); }

async function refreshBoot() {
  if (!navigator.onLine || !S.session) return;
  try {
    const r = await api('bootstrap');
    S.boot = r; await kput('boot', r);
    if (r.user && S.session) { S.session.user = r.user; await kput('session', S.session); if (r.user.must_change_pin && current() && current().name !== 'pin') { needPin(); return; } }
    if (isField()) {
      for (const v of r.villages) {
        if (!S.buckets[v.village_id] || !S.fetchedAt[v.village_id] || Date.now() - S.fetchedAt[v.village_id] > 600000) {
          try { await loadVillage(v.village_id, true); } catch (e) {}
        }
      }
    }
    await refreshStats();
    if (!SHEET && current() && current().name === 'home') render();
  } catch (e) {}
}

async function refreshStats(rerender, force) {
  if (!navigator.onLine || !S.boot) return;
  if (refreshStats._busy || (refreshStats._at && Date.now() - refreshStats._at < 90000 && !force)) return;
  refreshStats._busy = true;
  try {
    const ts = S.boot.tehsils.map(t => t.tehsil_id);
    for (const t of ts) { try { const r = await api('getStats', { tehsil_id: t }); S.stats[t] = r; await kput('stats:' + t, r); } catch (e) {} }
    refreshStats._at = Date.now();
    if (rerender && !SHEET && current() && current().name === 'home') render();
  } finally { refreshStats._busy = false; }
}

function updatePill() {
  const p = $('#pill'); if (!S.session) { p.hidden = true; return; }
  p.hidden = false; const n = S.queue.length; let t, c;
  if (S.syncing) { t = L('p_busy'); c = 'busy'; }
  else if (S.problems.length) { t = L('p_prob', S.problems.length); c = 'err'; }
  else if (!navigator.onLine) { t = n ? L('p_offn', n) : L('p_off'); c = 'off'; }
  else if (n) { t = L('p_wait', n); c = 'wait'; }
  else if (S.flash && Date.now() - S.flash < 3000) { t = L('p_flash'); c = 'ok-flash'; }
  else { t = L('p_all'); c = ''; }
  p.textContent = t; p.className = 'pill ' + c;
}

function countsLocal(arr) {
  const c = { total: arr.length, made: 0, A: 0, B: 0, C: 0, ns: 0, unl: 0, today: 0 }; const t = todayIST();
  arr.forEach(b => {
    if (b.status === 'CLAIMED') { c.made++; if (b.claimed_date === t) c.today++; }
    else if (b.status === 'NOT_SURVEYED') c.ns++;
    else c[tierOf(b.reason_code)]++;
  });
  return c;
}
function stripHtml(c) {
  const t = Math.max(1, c.total);
  const seg = (n, cls) => n > 0 ? `<i class="${cls}" style="width:${(n * 100 / t).toFixed(2)}%"></i>` : '';
  return `<div class="strip" aria-hidden="true">${seg(c.made, 's-made')}${seg(c.C, 's-C')}${seg(c.B, 's-B')}${seg(c.A, 's-A')}${seg(c.ns, 's-ns')}</div>`;
}
function legendHtml(c) {
  const it = (n, col, l) => `<span><i style="background:${col}"></i>${l} <b>${n}</b></span>`;
  return `<div class="legend">${it(c.made, 'var(--made)', L('lg_made'))}${it(c.C, 'var(--tc)', L('lg_C'))}${it(c.B, 'var(--tb)', L('lg_B'))}${it(c.A, 'var(--ta)', L('lg_A'))}${it(c.ns, 'var(--ns)', L('lg_ns'))}${c.unl > 0 ? it(c.unl, 'var(--unl)', L('lg_unl')) : ''}</div>`;
}
function statusOf(b) {
  if (b.status === 'CLAIMED') return { cls: 'made', text: b.reg_status || b.claimed_source === 'REG' ? L('st_reg') : L('st_made') };
  if (b.status === 'NOT_SURVEYED') return { cls: 'ns', text: L('st_ns') };
  const r = reason(b.reason_code); return { cls: tierOf(b.reason_code), text: r ? rLabel(r) : b.reason_code };
}
function rowHtml(b) {
  const s = statusOf(b);
  return `<button class="row" data-id="${esc(b.bucket_id)}"><span class="dot d-${s.cls}"></span><span class="rt"><b>${esc(b.name)}</b><small>${esc(b.parentage)}${b.khasras ? ', khasra ' + esc(shortKh(b.khasras)) : ''}</small></span><span class="st st-${s.cls}">${esc(s.text)}</span></button>`;
}
function topReasons(vid) {
  if (S.top[vid]) return S.top[vid];
  const freq = {}; (S.buckets[vid] || []).forEach(b => { if (b.status === 'REASON') freq[b.reason_code] = (freq[b.reason_code] || 0) + 1; });
  const pos = c => { const i = DEFAULT_TOP.indexOf(c); return i < 0 ? 99 : i; };
  const list = activeReasons().filter(r => r.code !== 'A01' && r.code !== 'C02')
    .sort((x, y) => (freq[y.code] || 0) - (freq[x.code] || 0) || pos(x.code) - pos(y.code)).slice(0, 6);
  S.top[vid] = list; return list;
}
function rbtnHtml(r, cur) { const t = rTxt(r); return `<button class="rbtn t${r.tier}${r.code === cur ? ' cur' : ''}" data-code="${r.code}"><b>${esc(t[0])}</b>${t[1] ? `<span class="hi">${esc(t[1])}</span>` : ''}</button>`; }
function reasonGrid(vid, curCode) {
  const top = topReasons(vid).slice(0, 5), codes = top.map(r => r.code);
  const rest = activeReasons().filter(r => !codes.includes(r.code));
  const grp = t => { const l = rest.filter(r => r.tier === t); return l.length ? `<p class="grp g${t}">${L('lg_' + t)}</p><div class="rgrid">${l.map(r => rbtnHtml(r, curCode)).join('')}</div>` : ''; };
  return `<div class="rgrid">${top.map(r => rbtnHtml(r, curCode)).join('')}<button class="otherr" type="button"><span>${L('q_other')} \u25BE</span><span class="hi">${H('q_other')}</span></button></div><div class="allr" hidden>${grp('A')}${grp('B')}${grp('C')}</div>`;
}

/* ======================= SAVING ======================= */
function validate(b, f) {
  const m = Object.assign({}, b, f);
  if (f.aadhaar && !validAadhaar(f.aadhaar)) return L('v_aad');
  if (f.mobile && !validMobile(f.mobile)) return L('v_mob');
  if (b.status === 'CLAIMED' && (b.claimed_source === 'PORTAL' || b.claimed_source === 'REG') && m.status !== 'CLAIMED') return L('v_lock');
  if (m.status === 'REASON' && !reason(m.reason_code)) return L('v_reason');
  if (m.status === 'REASON' && m.reason_code === 'B10' && !m.remarks) return L('v_rem');
  return '';
}
async function saveMany(vid, items) {
  const updates = [], local = []; const ts = nowIST();
  for (const it of items) {
    const err = validate(it.b, it.f); if (err) throw new Error(err);
  }
  items.forEach(it => { applyLocal(it.b, it.f); updates.push(Object.assign({ bucket_id: it.b.bucket_id, client_ts: ts, for_user: S.forUser || undefined }, it.f)); local.push({ bucket_id: it.b.bucket_id, fields: it.f }); });
  await kput('b:' + vid, S.buckets[vid]);
  S.dirty = true;
  await enqueue('saveBuckets', { updates }, local);
}
const saveOne = (vid, b, f) => saveMany(vid, [{ b, f }]);

/* ---------- Same farmer check ---------- */
function localGroups(vid) {
  const g = {}; (S.buckets[vid] || []).forEach(b => { if (b.dup_group) (g[b.dup_group] = g[b.dup_group] || []).push(Object.assign({ village: villageById(vid).name, editable: canEditV(vid) }, b)); });
  return Object.keys(g).filter(k => g[k].length >= 2).map(k => { const m = g[k]; const confirmed = m.every(x => x.dup_confirmed === 'Y');
    return { group: k, members: m, confirmed, conf: confirmed ? 'CONFIRMED' : (m.some(x => x.dup_conf === 'HIGH') ? 'HIGH' : 'MEDIUM') }; });
}
function dupLocalEffects(members, primaryId) {
  const out = [];
  members.forEach(m => {
    const f = { dup_confirmed: 'Y', dup_role: m.bucket_id === primaryId ? 'PRIMARY' : 'SECONDARY', dup_conf: 'CONFIRMED' };
    if (m.status !== 'CLAIMED') {
      if (f.dup_role === 'SECONDARY') { f.status = 'REASON'; f.reason_code = 'A01'; }
      else if (m.status === 'NOT_SURVEYED' || m.reason_code === 'A01') { f.status = 'REASON'; f.reason_code = 'C02'; }
    }
    out.push({ bucket_id: m.bucket_id, fields: f });
  });
  return out;
}
function applyEffects(effects) {
  const touched = new Set();
  effects.forEach(e => Object.keys(S.buckets).forEach(vid => { const b = S.buckets[vid].find(x => x.bucket_id === e.bucket_id); if (b) { applyLocal(b, e.fields); touched.add(vid); } }));
  return Promise.all([...touched].map(vid => kput('b:' + vid, S.buckets[vid])));
}

/* Reads either portal file and says which kind it is. */
async function parsePortalFile(f) {
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', raw: true });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
  const pi = rows.findIndex(r => r.some(c => /^\s*aadh?aa?r\s*_?(no|number)?\s*$/i.test(String(c))) && r.some(c => /registration/i.test(String(c))));
  if (pi >= 0) {
    const H = rows[pi].map(x => String(x).trim().toLowerCase().replace(/[\s_]+/g, ''));
    const col = (...ns) => { for (const n of ns) { const i = H.indexOf(n); if (i >= 0) return i; } return -1; };
    const ci = [col('registrationnumber', 'registrationno'), col('farmername', 'name', 'beneficiaryname'), col('fathername', 'father'), col('mobile', 'mobilenumber', 'mobileno'),
      col('aadharno', 'aadhaarno', 'aadhaarnumber', 'aadharnumber'), col('villagecode', 'lgdcode', 'villagelgdcode')];
    if (ci[1] < 0 || ci[5] < 0) throw new Error(f.name + ': PM Kisan columns not recognised (farmer name and village code are needed).');
    const ours = new Set(villages().map(v => v.village_id)), out = [];
    for (let i = pi + 1; i < rows.length; i++) { const r = rows[i], g = k => ci[k] < 0 ? '' : String(r[ci[k]] == null ? '' : r[ci[k]]).trim(); if (ours.has(g(5))) out.push([g(0), g(1), g(2), g(3), g(4), g(5)]); }
    return { type: 'pmk', name: f.name, rows: out };
  }
  const ri = rows.findIndex(r => r.some(c => /^\s*centralid\s*$/i.test(String(c))));
  if (ri >= 0) {
    const H = rows[ri].map(x => String(x).trim().toLowerCase()), col = n => H.indexOf(n.toLowerCase());
    const need = ['centralId', 'enrollmentNumber', 'frNameEn', 'gender', 'age', 'category', 'approvalStatus', 'insertedBy', 'farmerMobileNumber', 'aadhaarBase64', 'farmerAadhaarMask', 'villageLgdCode', 'lowestNameMatchScore'];
    const ci = need.map(col);
    if ([0, 2, 6, 11].some(k => ci[k] < 0)) throw new Error(f.name + ': some expected columns are missing (centralId, frNameEn, approvalStatus, villageLgdCode).');
    const out = [];
    for (let i = ri + 1; i < rows.length; i++) {
      const r = rows[i], get = k => ci[k] < 0 ? '' : String(r[ci[k]] == null ? '' : r[ci[k]]).trim();
      if (!get(0) && !get(1)) continue;
      out.push([get(0), get(1), get(2), get(3), get(4), get(5), get(6), get(7), get(8), b64digits(get(9)), get(10), get(11), get(12)]);
    }
    const m = f.name.match(/(\d{13})/);
    return { type: 'reg', name: f.name, rows: out, file_ts: m ? m[1] : '' };
  }
  const hi = rows.findIndex(r => r.some(c => /^\s*bucket\s*id\s*$/i.test(String(c))));
  if (hi < 0) throw new Error(f.name + ': not a portal file this app knows (no "Bucket ID" or "centralId" column).');
  const H = rows[hi].map(x => String(x).trim().toLowerCase()), col = n => H.indexOf(n);
  const ci = [col('bucket id'), col('village lgd code'), col('village name'), col('survey number'), col('farmer name'), col('identifier name')];
  if (ci.some(x => x < 0)) throw new Error(f.name + ': some expected columns are missing (Bucket ID, Village LGD Code, Village Name, Survey Number, Farmer Name, Identifier Name).');
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) { const r = rows[i]; if (!String(r[ci[0]] || '').trim()) continue; out.push(ci.map(c => String(r[c] == null ? '' : r[c]).trim())); }
  const m = f.name.match(/(\d{13})/);
  return { type: 'buckets', name: f.name, rows: out, file_ts: m ? m[1] : '' };
}

const DEFAULT_FOOT = 'Buckets claimed = Farmer IDs created (one Farmer ID per bucket). Rows 1 to 7, 13: buckets that can never yield a Farmer ID. Rows 8 to 12, 14: claimable only if the landholder becomes available or links Aadhaar with a mobile number. Row 15: claimable with field effort. Row 17: portal bucket list awaited, or the portal village summary and the portal unclaimed-bucket list differ.';
function groupVillages(st) {

function raceChart(hist, st) {

  const x = d => L + (W - L - R) * daysBetween(start, d) / span, y = v => T + (H - T - B) * (1 - v / maxY);
  const actual = pts.map(p => `${x(p.d).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  const req = `${x(start).toFixed(1)},${y(pts[0].y).toFixed(1)} ${x(end).toFixed(1)},${y(st.totals.achievable).toFixed(1)}`;
  const last = pts[pts.length - 1];
  return `<div class="chart"><b>Race to ${fmtDate(st.final_deadline)}</b>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Claimed records over time against the line needed to finish">
      <line x1="${L}" y1="${y(0)}" x2="${W - R}" y2="${y(0)}" stroke="#C9D3CE"/><line x1="${L}" y1="${y(maxY)}" x2="${W - R}" y2="${y(maxY)}" stroke="#EEF1EF"/>
      <text x="${L - 4}" y="${y(maxY) + 4}" font-size="10" text-anchor="end" fill="#56625C">${maxY}</text><text x="${L - 4}" y="${y(0) + 4}" font-size="10" text-anchor="end" fill="#56625C">0</text>
      <polyline points="${req}" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5"/>
      <polyline points="${actual}" fill="none" stroke="#16794A" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="${x(last.d)}" cy="${y(last.y)}" r="5" fill="#16794A"/>
      <text x="${L}" y="${H - 8}" font-size="10" fill="#56625C">${fmtDate(start)}</text><text x="${W - R}" y="${H - 8}" font-size="10" text-anchor="end" fill="#56625C">${fmtDate(end)}</text>
    </svg><div class="legend"><span><i style="background:#16794A"></i>Claimed so far</span><span><i style="background:#B45309"></i>Needed to finish (dashed)</span></div></div>`;
}
function dailyBars(hist, st) {
  const series = hist.concat([{ date: st.date, claimed: st.totals.claimed }]);
  const days = []; for (let i = 1; i < series.length; i++) days.push({ d: series[i].date, n: Math.max(0, (Number(series[i].claimed) || 0) - (Number(series[i - 1].claimed) || 0)) });
  const recent = days.slice(-10); if (!recent.length) return '';
  const mx = Math.max(st.totals.daily_target, ...recent.map(r => r.n), 1);
  const W = 340, H = 150, bw = (W - 20) / recent.length;
  const ty = 10 + (H - 40) * (1 - st.totals.daily_target / mx);
  return `<div class="chart"><b>Records claimed per day</b><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Claims per day">
    ${recent.map((r, i) => { const h = (H - 40) * r.n / mx; return `<rect x="${10 + i * bw + 3}" y="${H - 30 - h}" width="${bw - 6}" height="${h}" rx="3" fill="${r.n >= st.totals.daily_target ? '#16794A' : '#2C6B52'}" opacity="${r.n >= st.totals.daily_target ? 1 : .55}"/>
      <text x="${10 + i * bw + bw / 2}" y="${H - 34 - h}" font-size="10" text-anchor="middle" fill="#17201C">${r.n}</text>
      <text x="${10 + i * bw + bw / 2}" y="${H - 16}" font-size="9" text-anchor="middle" fill="#56625C">${r.d.slice(8, 10)}.${r.d.slice(5, 7)}</text>`; }).join('')}
    <line x1="10" x2="${W - 10}" y1="${ty}" y2="${ty}" stroke="#B45309" stroke-dasharray="5 4"/></svg>
    <div class="legend"><span><i style="background:#B45309"></i>Today's daily target (dashed)</span></div></div>`;
}
function reasonBars(st) {
  const codes = Object.keys(st.totals.by_code).sort((a, b) => st.totals.by_code[b] - st.totals.by_code[a]).slice(0, 8);
  if (!codes.length) return '<p class="hint">No reasons recorded yet.</p>';
  const mx = st.totals.by_code[codes[0]];
  return codes.map(c => { const r = reason(c) || { label: c, tier: 'B' }, n = st.totals.by_code[c];
    return `<div class="hbar"><span>${esc(r.label)}</span><span class="tr"><i style="width:${n * 100 / mx}%;background:var(--t${r.tier.toLowerCase()})"></i></span><b>${n}</b></div>`; }).join('');
}
function heatGrid(st) {
  const codes = Object.keys(st.totals.by_code).sort((a, b) => st.totals.by_code[b] - st.totals.by_code[a]).slice(0, 8);
  const cols = codes.map(c => ({ k: c, l: (reason(c) || { label: c }).label, f: v => (v.by_code || {})[c] || 0 })).concat([{ k: 'ns', l: 'Not checked yet', f: v => v.not_surveyed }]);
  const mx = {}; cols.forEach(c => mx[c.k] = Math.max(1, ...st.villages.map(c.f)));
  const shade = (n, m) => n ? `rgba(180,35,24,${(0.12 + 0.75 * n / m).toFixed(2)})` : '#F4F6F3';
  return `<div class="rwrap"><table class="heat"><tr><th>Village</th>${cols.map(c => `<th style="max-width:90px;white-space:normal;font-size:11px">${esc(c.l)}</th>`).join('')}</tr>
    ${st.villages.map(v => `<tr><td>${esc(v.name)}</td>${cols.map(c => { const n = c.f(v); return `<td style="background:${shade(n, mx[c.k])};color:${n / mx[c.k] > .55 ? '#fff' : '#17201C'}">${n || ''}</td>`; }).join('')}</tr>`).join('')}</table></div>`;
}

      ${canShare ? `<button class="btn" id="sh">Share (WhatsApp, email)</button>` : ''}

    mount: r => { $('#x', r).onclick = () => closeSheet(); const sh = $('#sh', r); if (sh) sh.onclick = async () => { try { await navigator.share({ files: [file], title: name }); } catch (e) {} }; }
  }));
}

/* ---------- Share my day (WhatsApp; the Patwari picks the chat) ---------- */
function shareMyDay() {
  const t = todayIST(), lines = [L('share_head', me().name, fmtDate(t))];
  villages().filter(v => canEditV(v.village_id) && v.practice !== 'Y').forEach(v => {
    const arr = S.buckets[v.village_id] || [];
    const checked = arr.filter(b => b.surveyed_date === t).length, ids = arr.filter(b => b.status === 'CLAIMED' && b.claimed_date === t).length;
    lines.push(L('share_line', v.name, checked, ids, arr.filter(b => b.status === 'NOT_SURVEYED').length));
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(lines.join('\n')), '_blank');
}

const addDaysJS = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };

async function quickReg(btn) {

    await loadXLSX(); const p = await parsePortalFile(f);
    if (p.type !== 'reg') throw new Error('This is a bucket list, not the registered-farmer file. Bucket lists go in "DC office files".');
    const dl = p.file_ts ? new Date(Number(p.file_ts) + 19800000).toISOString().slice(0, 10) : todayIST();
    const start = S.boot.settings.reg_start_date || '2026-08-02', back = addDaysJS(dl, -30);
    p.cov_to = dl; p.cov_from = back < start ? start : back;
    const pv = await api('regPreview', { rows: p.rows, file_ts: p.file_ts, cov_from: p.cov_from, cov_to: p.cov_to }, 120000);
    const t = (pv.tehsils || [])[0] || {}, issues = [];
    if (t.duplicate) issues.push('This exact file was already uploaded.');
    if (t.as_on && pv.downloaded_at.slice(0, 10) < t.as_on.slice(0, 10)) issues.push(`This file was downloaded before the last one (${fmtDate(t.as_on.slice(0, 10))}).`);
    const need = t.covered_to ? addDaysJS(t.covered_to, 1) : pv.start;
    if (p.cov_from > need) issues.push(`The period ${fmtDate(need)} to ${fmtDate(addDaysJS(p.cov_from, -1))} is not covered yet. Download that period from the portal too.`);
    if (pv.missing) issues.push(`${pv.missing} farmer(s) from an earlier file of this period are missing in this one.`);
    if (Object.keys(pv.unknown || {}).length) issues.push(`Villages not in the app will be skipped (LGD ${Object.keys(pv.unknown).join(', ')}).`);
    const apply = async (from, to) => {
      const r = await api('regApply', { rows: p.rows, file_ts: p.file_ts, file_name: f.name, cov_from: from, cov_to: to }, 180000);
      archiveUpload(f, 'reg', (r.villages[0] || {}).tehsil_id || me().tehsil_id);
      Object.keys(S.buckets).forEach(v => delete S.fetchedAt[v]); S.checklistAt = 0;
      toast(`Done: ${r.villages.reduce((s, v) => s + v.in_file, 0)} farmers, ${r.villages.reduce((s, v) => s + v.new, 0)} new, ${r.villages.reduce((s, v) => s + v.newly_approved, 0)} newly approved`);
      loadChecklist(); render();
    };
    if (!issues.length) { await apply(p.cov_from, p.cov_to); return; }
    openSheet(() => ({ html: `<div class="snav"><button id="x">Close</button><span></span><span></span></div><h2 class="nm">Please check this file</h2>
        <p class="hint">${esc(f.name)}, downloaded ${esc(pv.downloaded_at)}</p>${issues.map(x => `<p class="w">${esc(x)}</p>`).join('')}
        <div class="row2"><div class="field"><label>Period on the portal: from</label><input id="cf" type="date" class="input" value="${p.cov_from}"></div><div class="field"><label>to</label><input id="ct" type="date" class="input" value="${p.cov_to}"></div></div>
        <button class="btn btn-primary" id="ok">Apply anyway</button><button class="btn" id="no">Cancel</button>`,
      mount: r => { $('#x', r).onclick = $('#no', r).onclick = () => closeSheet();

let QUEUE = null;
async function startWork(vids) {
  for (const vid of vids) await loadVillage(vid);
  const kh = await kget('orderKh');
  const pct = vid => { const x = villageLeft(villageById(vid)); return x.total ? x.done / x.total : 1; };
  const order = vids.slice().sort((a, b) => pct(a) - pct(b));
  const byFam = (a, b) => (normName(a.parentage) || '').localeCompare(normName(b.parentage) || '') || a.name.localeCompare(b.name);
  const items = [], ph = (k, f) => order.forEach(vid => f(vid).forEach(id => items.push({ kind: k, vid, id })));
  ph('collect', vid => S.coll[vid] ? (S.pmk[vid] || []).filter(k => !k.linked && !k.outcome).map(k => k.pmk_id) : []);
  ph('sort', vid => S.coll[vid] ? [] : (S.buckets[vid] || []).filter(b => b.status === 'NOT_SURVEYED' && b.flag !== 'LATER').sort(kh ? (a, b) => khKey(a) - khKey(b) : byFam).map(b => b.bucket_id));
  ph('poss', vid => { const pm = new Set((S.pmk[vid] || []).map(k => k.bucket_id).filter(Boolean));
    return (S.buckets[vid] || []).filter(b => b.status === 'REASON' && b.reason_code === 'C03').sort((a, b) => pm.has(b.bucket_id) - pm.has(a.bucket_id)).map(b => b.bucket_id); });
  ph('link', vid => (S.reg[vid] || []).filter(f => f.candidates && f.candidates.length).map(f => f.farmer_id));
  ph('collect', vid => S.coll[vid] ? (S.pmk[vid] || []).filter(k => k.outcome === 'NOT_AVAILABLE' || k.linked === 'LATER').map(k => k.pmk_id) : []);
  ph('sort', vid => S.coll[vid] ? [] : (S.buckets[vid] || []).filter(b => b.status === 'NOT_SURVEYED' && b.flag === 'LATER').map(b => b.bucket_id));
  if (!items.length) { if (vids.every(v => S.coll[v] && !(S.pmk[v] || []).length)) toast('The PM Kisan list is not uploaded yet. Ask the Dealing Assistant.'); else leafMoment('Nothing left in your villages. Shabash!'); return; }
  QUEUE = { items, i: 0 }; PKIND = 'queue';
  openSheet(queueBuild);
}
function stillOpen(it) {
  if (it.kind === 'collect') { const k = (S.pmk[it.vid] || []).find(x => x.pmk_id === it.id); return k && (!k.linked || k.linked === 'LATER') && (!k.outcome || k.outcome === 'NOT_AVAILABLE'); }
  if (it.kind === 'link') return (S.reg[it.vid] || []).some(f => f.farmer_id === it.id);
  const b = (S.buckets[it.vid] || []).find(x => x.bucket_id === it.id); if (!b) return false;
  return it.kind === 'sort' ? b.status === 'NOT_SURVEYED' : b.status === 'REASON' && b.reason_code === 'C03';
}
function queueBuild() {
  const it = QUEUE.items[QUEUE.i];

}

      : ['<b>Upload files</b>: three named buttons with the last upload time.', '<b>Needs attention</b>: PIN requests, invites, idle villages in one place.', 'Work tab by Patwar Halqa, with Aadhaar collection.', 'Tools: notices, spot checks, drive lists, custom Excel, weekly summary.'];
    openSheet(() => ({ html: `<div class="snav"><button id="x">Close</button><span></span><span></span></div><div class="tcard"><div class="big">${LEAF_SVG}</div><h2>What's new</h2>
      ${pts.map(x => `<p style="text-align:left">• ${x}</p>`).join('')}</div><button class="btn btn-primary" id="ok">Got it</button>`,
      mount: r => { $('#x', r).onclick = $('#ok', r).onclick = () => closeSheet(() => { kget('tour:' + me().user_id).then(t => { if (!t) showTour(); }); }); } }));
  } else if (!(await kget('tour:' + me().user_id))) showTour();
};

/* collection villages: never shown as "bucket list missing" while the PM Kisan list is still downloading */
const _vl51 = villageLeft;
villageLeft = function (v) {
  if (isCollV(v) && !(S.pmk && S.pmk[v.village_id] && S.coll[v.village_id])) return { coll: true, total: 0, done: 0, left: 0, loading: true };
  return _vl51(v);
};
const _fc51 = fieldCard;
fieldCard = function (v) {
  const x = villageLeft(v);
  if (x.loading) return `<button class="vc2" data-v="${esc(v.village_id)}">${ringSvg('…', 0, 64)}<span><b>${esc(v.name)}</b><small>Aadhaar collection (PM Kisan) · tap to open</small></span></button>`;
  if (!x.coll && !x.total && !S.buckets[v.village_id] && navigator.onLine) return `<button class="vc2" data-v="${esc(v.village_id)}">${ringSvg('…', 0, 64)}<span><b>${esc(v.name)}</b><small>Tap to open</small></span></button>`;
  return _fc51(v);
};
NAME_DROP.push('mr', 'mrs', 'ms', 'miss', 'dr');
/* "Needs attention" now lists villages without staff and totals to confirm; the tehsil box keeps only the deadline warning */
alertsHtml = function (t, act) { return t.deadline_passed ? `<div class="banner red"><p><b>The deadline has passed.</b> Set the new deadline in Settings so targets are right.</p>${act || role() === 'ADMIN' ? '<button data-go="settings">Settings</button>' : ''}</div>` : ''; };

/* ======================= START ======================= */
async function start() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(reg => {
    const show = () => { $('#upd').hidden = false; };
    if (reg.waiting && navigator.serviceWorker.controller) show();
    reg.addEventListener('updatefound', () => { const nw = reg.installing; if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) show(); }); });
    setInterval(() => reg.update().catch(() => {}), 20 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  $('#updBtn').onclick = () => location.reload();
  try { S.zoom = Number(await kget('zoom')) || 1; document.documentElement.style.setProperty('--z', S.zoom); } catch (e) {}
  try { S.session = await kget('session'); } catch (e) { $('#view').innerHTML = '<div class="pad"><p class="err">This browser cannot save data. Do not use private or incognito mode.</p></div>'; return; }
  window.addEventListener('online', () => { updatePill(); sync(); refreshBoot(); });
  window.addEventListener('offline', updatePill);
  setInterval(() => { sync(); if (reminderDue() && S.reminded !== todayIST()) { S.reminded = todayIST(); fail(L('remind_toast')); if (current() && current().name === 'home' && !SHEET) render(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { sync(); refreshStats(); } });
  if (!S.session) { NAV.stack = [{ name: 'login', args: {} }]; render(); return; }
  S.boot = await kget('boot'); S.queue = (await kget(qKey())) || []; S.problems = (await kget(pKey())) || []; S.lastSync = (await kget('lastSync')) || '';
  if (S.boot) for (const t of S.boot.tehsils) { const c = await kget('stats:' + t.tehsil_id); if (c) S.stats[t.tehsil_id] = c; }
  if (!S.boot) {
    try { S.boot = await api('bootstrap'); await kput('boot', S.boot); }
    catch (e) { NAV.stack = [{ name: 'login', args: {} }]; render(); return; }
  }
  await initLang();
  if (!needPin()) { NAV.stack = [{ name: 'home', args: {} }]; history.replaceState({}, ''); render(); }
  maybeLock(); refreshBoot(); scheduleSync(800); if (['ADMIN', 'DA', 'NT'].includes(role())) loadHome(true).then(() => { if (current() && current().name === 'home' && !SHEET) render(); });
  if (!me().must_change_pin && !(await kget('tour:' + me().user_id))) setTimeout(showTour, 500);
}
start();
</script>
